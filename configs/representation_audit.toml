[paths]
data_dir = "data/dashcam"
artifacts_dir = "artifacts"

[clips]
duration_seconds = 1.0
sampling_fps = 4.0

[splits]
train = ["DJI_0477_001", "DJI_0477_002"]
validation = ["DJI_0477_003"]
test = ["DJI_0478_001", "DJI_0478_002", "DJI_0478_003"]

[encoder]
model_id = "facebook/vjepa2-vitl-fpc64-256"
revision = "b3c1679b7c34d3255ef3547f27c7b226aefab26f"
device = "cuda"
decode_device = "cuda"
dtype = "bfloat16"
attention = "sdpa"
batch_size = 8

[preprocess]
mode = "letterbox"
size = 256

[analysis]
name = "representation_audit"
seed = 17
retrieval_queries = 12
retrieval_neighbors = 5
pca_components = 50
pair_samples = 5000
outlier_neighbors = 10
outlier_count = 20
